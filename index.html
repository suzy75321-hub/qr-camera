<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카메라 테스트</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h1 {
  font-size: 24px;
  margin: 5px 0 15px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

video {
  width: 100%;
  background: #000;
  border-radius: 15px;
  display: block;
  margin-top: 15px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#message {
  margin-top: 18px;
  font-weight: bold;
  white-space: pre-line;
}

#error {
  margin-top: 15px;
  color: #c62828;
  font-weight: bold;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="box">

<h1>📷 카메라 테스트</h1>

<div id="studentInfo" class="info">
확인 중...
</div>

<button
  type="button"
  onclick="startCamera()"
>
카메라 시작
</button>

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div id="message">
카메라 시작을 눌러주세요.
</div>

<div id="error"></div>

</div>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();

const studentName =
  String(
    params.get("studentName") || ""
  ).trim();

const action =
  String(
    params.get("action") || ""
  ).trim();

document.getElementById(
  "studentInfo"
).innerHTML =
  "<b>" +
  escapeHtml(studentNumber) +
  " " +
  escapeHtml(studentName) +
  "</b><br><br>" +
  "출결 : " +
  escapeHtml(action);


let stream = null;


async function startCamera() {

  document.getElementById(
    "message"
  ).innerText =
    "카메라를 준비하는 중입니다...";

  document.getElementById(
    "error"
  ).innerText =
    "";

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "이 브라우저에서는 카메라 기능을 사용할 수 없습니다."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    const video =
      document.getElementById(
        "video"
      );

    video.srcObject =
      stream;


    await video.play();


    document.getElementById(
      "message"
    ).innerText =
      "✅ 카메라가 정상적으로 열렸습니다.";

  } catch (error) {

    console.error(error);

    document.getElementById(
      "message"
    ).innerText =
      "❌ 카메라를 열지 못했습니다.";

    document.getElementById(
      "error"
    ).innerText =
      "오류 종류: " +
      error.name +
      "\n\n" +
      "오류 내용: " +
      error.message;

  }

}


window.addEventListener(
  "pagehide",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );

      stream = null;

    }

  }
);


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
