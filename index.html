<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR 인증</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align:center;
  padding:20px;
  background:#f5f7fb;
}

.box {
  max-width:420px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1 {
  font-size:24px;
}

.info {
  margin:15px 0;
  line-height:1.6;
}

button {
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#333;
  color:white;
  font-size:18px;
  font-weight:bold;
}

#reader {
  margin-top:20px;
}

#result {
  margin-top:15px;
  font-weight:bold;
  color:green;
}

#error {
  margin-top:15px;
  color:red;
  white-space:pre-line;
}

</style>

</head>


<body>

<div class="box">

<h1>📷 QR 인증</h1>

<div class="info">
교실 QR을 촬영해주세요.<br>
QR 촬영 시간이<br>
실제 등교/복귀 시간으로 기록됩니다.
</div>


<div id="studentInfo"></div>


<button onclick="startCamera()">
📷 카메라 시작
</button>


<div id="reader"></div>


<div id="result"></div>

<div id="error"></div>


</div>



<script>


const params =
new URLSearchParams(location.search);


const studentNumber =
params.get("studentNumber") || "";

const studentName =
params.get("studentName") || "";

const action =
params.get("action") || "";



document.getElementById("studentInfo").innerHTML =
`
<b>${studentNumber} ${studentName}</b><br>
출결 : ${action}
`;



let html5QrCode = null;



async function startCamera(){


  document.getElementById("error").innerText="";


  try{


    html5QrCode =
      new Html5Qrcode("reader");



    const cameras =
      await Html5Qrcode.getCameras();



    if(!cameras || cameras.length === 0){

      throw new Error(
        "카메라를 찾을 수 없습니다."
      );

    }



    let cameraId =
      cameras[0].id;



    // 아이폰 후면 우선
    if(cameras.length > 1){

      cameraId =
        cameras[cameras.length - 1].id;

    }



    await html5QrCode.start(

      cameraId,


      {
        fps:20,

        qrbox:{
          width:280,
          height:280
        },

        aspectRatio:1.0

      },


      onScanSuccess,


      function(errorMessage){

        // 스캔 실패 메시지는 무시

      }


    );


  }catch(error){


    document.getElementById("error").innerText =
    "❌ 카메라 오류\n\n" + error;


  }


}



async function onScanSuccess(decodedText){


  document.getElementById("result").innerHTML =
  `
  ✅ QR 인식 완료<br>
  ${decodedText}
  `;



  try{

    await html5QrCode.stop();

  }catch(e){}



}



</script>


</body>
</html>
