<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>교실 QR 인증</title>

<script
  src="https://unpkg.com/html5-qrcode"
></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
}

.box {
  max-width: 460px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin: 5px 0 10px;
  font-size: 25px;
  text-align: center;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
  text-align: center;
}

#reader {
  width: 100%;
  margin-top: 10px;
}

#result {
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

#error {
  margin-top: 18px;
  color: #c62828;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}

.small {
  margin-top: 15px;
  color: #777;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

</style>

</head>


<body>

<div class="box">

<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
확인 중...
</div>


<div id="reader"></div>


<div
  id="result"
></div>


<div
  id="error"
></div>


<div class="small">

교실에 있는 고정 QR을 찍어주세요.<br>

<b>
QR 인증이 성공하면 실제 등교/복귀 시간이 기록됩니다.
</b>

</div>


</div>


<script>

// ============================================================
// URL 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script 주소
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 학생 정보 표시
// ============================================================

document
  .getElementById("studentInfo")
  .innerHTML =
    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +
    "출결 : " +
    escapeHtml(action);


// ============================================================
// 기본 정보 확인
// ============================================================

if (
  !studentNumber ||
  !studentName ||
  !action ||
  !returnUrl
) {

  showError(
    "인증 정보가 없습니다.\n" +
    "조종례 앱에서 다시 시도해주세요."
  );

} else {

  startQrScanner();

}


// ============================================================
// QR 스캐너
// ============================================================

function startQrScanner() {

  const formatsToSupport = [

    Html5QrcodeSupportedFormats.QR_CODE

  ];


  const scanner =
    new Html5QrcodeScanner(
      "reader",
      {

        fps: 10,

        qrbox: {
          width: 260,
          height: 260
        },

        formatsToSupport:
          formatsToSupport,

        rememberLastUsedCamera:
          true,

        supportedScanTypes: [

          Html5QrcodeScanType.SCAN_TYPE_CAMERA,

          Html5QrcodeScanType.SCAN_TYPE_FILE

        ]

      },

      false
    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );

}


// ============================================================
// QR 성공
// ============================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  showResult(
    "✅ QR을 읽었습니다.\n" +
    "학생 정보를 확인하고 있습니다..."
  );


  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  // 중복 스캔 방지
  window.location.href =
    verifyUrl;

}


// ============================================================
// QR 스캔 중 오류
// ============================================================

function onScanFailure(
  error
) {

  // QR을 찾지 못하는 동안에는
  // 화면에 오류를 계속 띄우지 않음

}


// ============================================================
// 메시지
// ============================================================

function showResult(
  text
) {

  document
    .getElementById(
      "result"
    )
    .innerText =
      text;


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


function showError(
  text
) {

  document
    .getElementById(
      "error"
    )
    .innerText =
      "❌ " +
      text;


  document
    .getElementById(
      "result"
    )
    .innerText =
      "";

}


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
