<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR 인증</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 440px;
      margin: auto;
      background: white;
      padding: 28px 20px 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 5px 0 10px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      margin: 20px auto;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-line;
    }

    .button {
      width: 100%;
      padding: 17px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      background: #eeeeee;
    }

    .error {
      color: #d33;
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>📷 QR 인증</h1>

  <div class="subtitle">
    교실 QR을 촬영해주세요.
    <br>
    QR을 촬영한 시간이 실제 등교/복귀 시간으로 기록됩니다.
  </div>

  <div id="reader"></div>

  <div
    id="message"
    class="message"
  >
    카메라를 준비하고 있습니다...
  </div>

  <button
    class="button"
    onclick="goBack()"
  >
    취소하고 돌아가기
  </button>

</div>


<script>

  // ========================================
  // 우리반 앱 정보
  // ========================================

  const params =
    new URLSearchParams(
      window.location.search
    );


  const studentNumber =
    params.get("studentNumber");


  const studentName =
    params.get("studentName");


  const action =
    params.get("action");


  const returnUrl =
    params.get("returnUrl");


  // ========================================
  // 잘못된 접근 확인
  // ========================================

  if (
    !studentNumber ||
    !studentName ||
    !action ||
    !returnUrl
  ) {

    document
      .getElementById("reader")
      .innerHTML = "";

    document
      .getElementById("message")
      .innerHTML =
        '<div class="error">' +
        '❌ 잘못된 접근입니다.<br>' +
        '우리반 앱에서 다시 시작해주세요.' +
        '</div>';

  } else {

    startScanner();

  }


  // ========================================
  // 메시지
  // ========================================

  function setMessage(text) {

    document
      .getElementById("message")
      .innerText = text;

  }


  // ========================================
  // QR 스캐너 시작
  // ========================================

  function startScanner() {

    const scanner =
      new Html5Qrcode("reader");


    const scannerConfig = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]

    };


    scanner
      .start(

        {
          facingMode: "environment"
        },

        scannerConfig,

        function(decodedText) {

          scanner
            .stop()
            .then(function() {

              scanner.clear();

              processQr(decodedText);

            })
            .catch(function() {

              processQr(decodedText);

            });

        },

        function() {

          // QR 탐색 중에는 아무 메시지도 표시하지 않음

        }

      )

      .then(function() {

        setMessage(
          "📷 교실 QR을 촬영해주세요."
        );

      })

      .catch(function(error) {

        console.error(error);

        setMessage(
          "❌ 카메라를 사용할 수 없습니다.\n\n" +
          "브라우저의 카메라 권한을 허용해주세요."
        );

      });

  }


  // ========================================
  // QR 촬영 성공
  // ========================================

  function processQr(scannedToken) {

    setMessage(
      "🔐 QR 인증 중입니다..."
    );


    // Apps Script로 전달
    const url =
      returnUrl +
      "?mode=qr" +
      "&studentNumber=" +
      encodeURIComponent(studentNumber) +
      "&studentName=" +
      encodeURIComponent(studentName) +
      "&action=" +
      encodeURIComponent(action) +
      "&token=" +
      encodeURIComponent(scannedToken);


    window.location.href = url;

  }


  // ========================================
  // 취소
  // ========================================

  function goBack() {

    if (returnUrl) {

      window.location.href =
        returnUrl;

    } else {

      history.back();

    }

  }

</script>

</body>

</html>
