<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>교실 QR 인증</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  font-size: 24px;
  margin: 5px 0 15px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

video {
  width: 100%;
  max-width: 380px;
  min-height: 220px;
  background: #000;
  border-radius: 15px;
  display: block;
  margin: 15px auto;
  object-fit: cover;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  border: 0;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#message {
  margin-top: 18px;
  line-height: 1.5;
  font-weight: bold;
  white-space: pre-line;
}

#error {
  margin-top: 15px;
  color: #c62828;
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}

</style>

</head>


<body>


<div class="box">


<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
확인 중...
</div>


<button
  id="startButton"
  onclick="startCamera()"
>
카메라 시작
</button>


<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<canvas
  id="canvas"
  style="display:none;"
></canvas>


<div id="message">
카메라 시작을 눌러주세요.
</div>


<div id="error"></div>


</div>


<script>


// ============================================================
// 학생 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 카메라 상태
// ============================================================

let stream = null;

let scanning = false;

let completed = false;

let animationFrame = null;


// ============================================================
// 화면 요소
// ============================================================

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const context =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


// ============================================================
// 학생 정보 표시
// ============================================================

document
  .getElementById(
    "studentInfo"
  )
  .innerHTML =

    "<b>" +
    escapeHtml(
      studentNumber
    ) +
    " " +
    escapeHtml(
      studentName
    ) +
    "</b><br><br>" +

    "출결 : " +
    escapeHtml(
      action
    );


// ============================================================
// 카메라 시작
// ============================================================

async function startCamera() {

  document
    .getElementById(
      "message"
    )
    .innerText =
      "카메라를 준비하는 중입니다...";


  document
    .getElementById(
      "error"
    )
    .innerText = "";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "이 브라우저에서는 카메라 API를 사용할 수 없습니다."
      );

    }


    // ========================================================
    // 중요
    // test.html에서 성공했던 코드 그대로
    // ========================================================

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    scanning =
      true;


    document
      .getElementById(
        "startButton"
      )
      .disabled =
        true;


    document
      .getElementById(
        "message"
      )
      .innerText =
        "✅ 카메라가 켜졌습니다.\n" +
        "교실 QR을 화면에 맞춰주세요.";


    scanLoop();


  } catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        "message"
      )
      .innerText =
        "❌ 카메라를 열지 못했습니다.";


    document
      .getElementById(
        "error"
      )
      .innerText =
        "오류 종류: " +
        error.name +
        "\n\n" +
        "오류 내용: " +
        error.message;

  }

}


// ============================================================
// QR 스캔 반복
// ============================================================

function scanLoop() {

  if (
    !scanning ||
    completed
  ) {

    return;

  }


  if (
    video.readyState <
    HTMLMediaElement.HAVE_CURRENT_DATA
  ) {

    animationFrame =
      requestAnimationFrame(
        scanLoop
      );

    return;

  }


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    animationFrame =
      requestAnimationFrame(
        scanLoop
      );

    return;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const imageData =
    context.getImageData(
      0,
      0,
      width,
      height
    );


  const qr =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );


  if (
    qr &&
    qr.data
  ) {

    handleQrSuccess(
      qr.data
    );

    return;

  }


  animationFrame =
    requestAnimationFrame(
      scanLoop
    );

}


// ============================================================
// QR 성공
// ============================================================

function handleQrSuccess(
  decodedText
) {

  if (
    completed
  ) {

    return;

  }


  completed =
    true;

  scanning =
    false;


  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame =
      null;

  }


  stopCamera();


  document
    .getElementById(
      "message"
    )
    .innerText =
      "✅ QR을 읽었습니다.\n" +
      "출결을 확인하는 중입니다...";


  // ==========================================================
  // Apps Script 인증 요청
  // ==========================================================

  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  window.location.href =
    verifyUrl;

}


// ============================================================
// 카메라 종료
// ============================================================

function stopCamera() {

  scanning =
    false;


  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame =
      null;

  }


  if (
    stream
  ) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  video.srcObject =
    null;

}


// ============================================================
// 페이지 종료
// ============================================================

window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>


</body>

</html>
