<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>교실 QR 인증</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin: 5px 0 10px;
  font-size: 25px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

.camera-button {
  display: block;
  width: 100%;
  padding: 17px;
  margin: 8px 0;
  border: none;
  border-radius: 14px;
  background: #333;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

#result {
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

#error {
  margin-top: 18px;
  color: #c62828;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}

.small {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 14px;
}

.loading {
  background: #eeeeee;
  color: #555;
}

</style>

</head>


<body>

<div class="box">

<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
확인 중...
</div>


<label
  for="qrImage"
  class="camera-button"
  id="cameraButton"
>
📷 교실 QR 찍기
</label>


<input
  id="qrImage"
  class="file-input"
  type="file"
  accept="image/*"
  capture="environment"
>


<div id="result"></div>

<div id="error"></div>


<div class="small">

교실에 있는 고정 QR을 찍어주세요.<br>

촬영한 QR이 확인되면<br>

<b>QR을 찍은 시간이 실제 등교/복귀 시간으로 기록됩니다.</b>

</div>


</div>


<script>


// ============================================================
// URL 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script 주소
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 화면 정보
// ============================================================

document
  .getElementById("studentInfo")
  .innerHTML =
    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +
    "출결 : " +
    escapeHtml(action) +
    "<br><br>" +
    "교실 QR을 찍어주세요.";


// ============================================================
// 필수 정보 검사
// ============================================================

if (
  !studentNumber ||
  !studentName ||
  !action ||
  !returnUrl
) {

  showError(
    "인증 정보가 없습니다.\n" +
    "조종례 앱에서 다시 시도해주세요."
  );


  document
    .getElementById("cameraButton")
    .style.pointerEvents =
      "none";

}


// ============================================================
// 사진 선택/촬영
// ============================================================

document
  .getElementById("qrImage")
  .addEventListener(
    "change",
    handleImage
  );


// ============================================================
// 이미지 처리
// ============================================================

async function handleImage(event) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {
    return;
  }


  clearMessages();


  setLoading(
    true
  );


  try {

    showResult(
      "📷 사진을 확인하고 있습니다..."
    );


    // --------------------------------------------------------
    // 이미지 객체 생성
    // --------------------------------------------------------

    const image =
      await loadImage(
        file
      );


    // --------------------------------------------------------
    // QR 판독을 위해 Canvas에 그림
    // --------------------------------------------------------

    const canvas =
      document.createElement(
        "canvas"
      );


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    const maxSize =
      1600;


    let width =
      image.naturalWidth ||
      image.width;


    let height =
      image.naturalHeight ||
      image.height;


    // 너무 큰 사진 축소
    if (
      width >
      maxSize ||
      height >
      maxSize
    ) {

      const ratio =
        Math.min(
          maxSize / width,
          maxSize / height
        );


      width =
        Math.round(
          width * ratio
        );


      height =
        Math.round(
          height * ratio
        );

    }


    canvas.width =
      width;


    canvas.height =
      height;


    context.drawImage(
      image,
      0,
      0,
      width,
      height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        width,
        height
      );


    // --------------------------------------------------------
    // QR 읽기
    // --------------------------------------------------------

    const qr =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (
      !qr ||
      !qr.data
    ) {

      throw new Error(
        "사진에서 QR을 찾지 못했습니다.\n" +
        "QR이 화면에 선명하게 나오도록 다시 찍어주세요."
      );

    }


    // --------------------------------------------------------
    // QR 발견
    // --------------------------------------------------------

    showResult(
      "✅ QR을 읽었습니다.\n" +
      "출결을 확인하고 있습니다..."
    );


    await verifyQr(
      qr.data
    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      "❌ " +
      error.message
    );


  } finally {

    setLoading(
      false
    );


    // 같은 사진을 다시 선택할 수 있도록 초기화
    event.target.value =
      "";

  }

}


// ============================================================
// 이미지 로드
// ============================================================

function loadImage(
  file
) {

  return new Promise(
    function(resolve, reject) {

      const url =
        URL.createObjectURL(
          file
        );


      const image =
        new Image();


      image.onload =
        function() {

          URL.revokeObjectURL(
            url
          );


          resolve(
            image
          );

        };


      image.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );


          reject(
            new Error(
              "촬영한 이미지를 읽을 수 없습니다."
            )
          );

        };


      image.src =
        url;

    }
  );

}


// ============================================================
// QR 서버 인증
// ============================================================

async function verifyQr(
  decodedText
) {

  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  window.location.href =
    verifyUrl;

}


// ============================================================
// 버튼 상태
// ============================================================

function setLoading(
  loading
) {

  const button =
    document.getElementById(
      "cameraButton"
    );


  if (loading) {

    button.innerText =
      "⏳ QR 확인 중...";


    button.classList.add(
      "loading"
    );


  } else {

    button.innerText =
      "📷 교실 QR 찍기";


    button.classList.remove(
      "loading"
    );

  }

}


// ============================================================
// 메시지
// ============================================================

function showResult(
  text
) {

  document
    .getElementById(
      "result"
    )
    .innerText =
      text;


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


function showError(
  text
) {

  document
    .getElementById(
      "error"
    )
    .innerText =
      text;


  document
    .getElementById(
      "result"
    )
    .innerText =
      "";

}


function clearMessages() {

  document
    .getElementById(
      "result"
    )
    .innerText =
      "";


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
