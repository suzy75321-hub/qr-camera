<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>교실 QR 인증</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin: 5px 0 10px;
  font-size: 25px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

#reader {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: none;
  border-radius: 13px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.dark {
  background: #333;
  color: white;
}

.gray {
  background: #eeeeee;
}

#result {
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

#error {
  margin-top: 18px;
  color: #c62828;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

.small {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

</style>

</head>


<body>

<div class="box">

<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
  확인 중...
</div>


<button
  id="startButton"
  class="button dark"
  type="button"
  onclick="startCamera()"
>
📷 카메라 시작
</button>


<button
  id="stopButton"
  class="button gray hidden"
  type="button"
  onclick="stopCamera()"
>
카메라 끄기
</button>


<div id="reader"></div>


<div id="result"></div>

<div id="error"></div>


<div class="small">

교실에 있는 QR을 한 번만 찍어주세요.<br>

<b>
QR을 인증한 시간이 실제 등교/복귀 시간으로 기록됩니다.
</b>

</div>


</div>


<script>


// ============================================================
// URL 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script 주소
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 상태
// ============================================================

let scanner = null;

let scanning = false;

let completed = false;

let starting = false;


// ============================================================
// 학생정보 표시
// ============================================================

document
  .getElementById("studentInfo")
  .innerHTML =
    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +
    "출결 : " +
    escapeHtml(action) +
    "<br><br>" +
    "교실 QR을 찍어주세요.";


// ============================================================
// 필수 정보 확인
// ============================================================

if (
  !studentNumber ||
  !studentName ||
  !action ||
  !returnUrl
) {

  showError(
    "인증 정보가 없습니다.\n" +
    "조종례 앱에서 다시 시도해주세요."
  );

  document
    .getElementById("startButton")
    .disabled = true;

}


// ============================================================
// 카메라 시작
// ============================================================

async function startCamera() {

  if (
    starting ||
    scanning ||
    completed
  ) {

    return;
  }


  starting = true;


  clearMessage();


  try {

    // ----------------------------------------------
    // 새 스캐너 생성
    // ----------------------------------------------

    scanner =
      new Html5Qrcode(
        "reader"
      );


    // ----------------------------------------------
    // 후면 카메라를 직접 요청
    // ----------------------------------------------

    const cameraConfig = {

      facingMode: {
        exact: "environment"
      }

    };


    const scanConfig = {

      fps: 10,

      qrbox: {
        width: 260,
        height: 260
      },

      aspectRatio: 1.0,

      disableFlip: true

    };


    await scanner.start(

      cameraConfig,

      scanConfig,

      function(decodedText) {

        handleScan(decodedText);

      },

      function() {

        // 스캔 중에는 아무 메시지도 표시하지 않음

      }

    );


    scanning = true;

    starting = false;


    document
      .getElementById("startButton")
      .classList
      .add("hidden");


    document
      .getElementById("stopButton")
      .classList
      .remove("hidden");


  } catch (error) {

    starting = false;

    scanning = false;


    console.error(
      error
    );


    // ----------------------------------------------
    // environment 직접 요청이 실패하면
    // 일반 카메라 설정으로 한 번 더 시도
    // ----------------------------------------------

    await retryCamera();


  }

}


// ============================================================
// 보조 카메라 시작
// ============================================================

async function retryCamera() {

  try {

    if (scanner) {

      try {
        await scanner.clear();
      } catch(e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const scanConfig = {

      fps: 10,

      qrbox: {
        width: 260,
        height: 260
      },

      aspectRatio: 1.0

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      scanConfig,

      function(decodedText) {

        handleScan(decodedText);

      },

      function() {}

    );


    scanning = true;


    document
      .getElementById("startButton")
      .classList
      .add("hidden");


    document
      .getElementById("stopButton")
      .classList
      .remove("hidden");


  } catch (error) {

    scanning = false;

    starting = false;


    showError(
      "❌ 카메라를 열 수 없습니다.\n\n" +
      "이 페이지에서는 카메라 연결에 실패했습니다."
    );

  }

}


// ============================================================
// QR 스캔 성공
// ============================================================

async function handleScan(
  decodedText
) {

  if (
    completed ||
    !scanning
  ) {

    return;
  }


  completed = true;

  scanning = false;


  showResult(
    "✅ QR을 확인했습니다.\n" +
    "출결을 처리하고 있습니다..."
  );


  await stopCamera();


  // ----------------------------------------------------------
  // 서버 인증
  // ----------------------------------------------------------

  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  window.location.href =
    verifyUrl;

}


// ============================================================
// 카메라 종료
// ============================================================

async function stopCamera() {

  if (!scanner) {

    scanning = false;

    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.warn(
      "camera stop:",
      error
    );

  }


  try {

    await scanner.clear();

  } catch (error) {

    console.warn(
      "scanner clear:",
      error
    );

  }


  scanner = null;

  scanning = false;


  document
    .getElementById("stopButton")
    .classList
    .add("hidden");


  if (!completed) {

    document
      .getElementById("startButton")
      .classList
      .remove("hidden");

  }

}


// ============================================================
// 메시지
// ============================================================

function showResult(
  text
) {

  document
    .getElementById("result")
    .innerText =
      text;


  document
    .getElementById("error")
    .innerText =
      "";

}


function showError(
  text
) {

  document
    .getElementById("error")
    .innerText =
      text;


  document
    .getElementById("result")
    .innerText =
      "";

}


function clearMessage() {

  document
    .getElementById("result")
    .innerText =
      "";


  document
    .getElementById("error")
    .innerText =
      "";

}


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
