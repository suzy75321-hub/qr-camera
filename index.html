<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교실 카메라 테스트</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  font-size: 24px;
  margin: 5px 0 15px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

video {
  width: 100%;
  max-width: 380px;
  min-height: 220px;
  background: #000;
  border-radius: 15px;
  display: block;
  margin: 15px auto;
  object-fit: cover;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  border: 0;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

#message {
  margin-top: 18px;
  line-height: 1.5;
  font-weight: bold;
  white-space: pre-line;
}

#error {
  margin-top: 15px;
  color: #c62828;
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>📷 교실 카메라 테스트</h1>

<div id="studentInfo" class="info">
확인 중...
</div>

<button id="startButton" onclick="startCamera()">
카메라 시작
</button>

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div id="message">
카메라 시작을 눌러주세요.
</div>

<div id="error"></div>

</div>

<script>

// ========================================
// 현재 페이지에 전달된 정보
// ========================================

const params =
  new URLSearchParams(
    window.location.search
  );

const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();

const studentName =
  String(
    params.get("studentName") || ""
  ).trim();

const action =
  String(
    params.get("action") || ""
  ).trim();


// ========================================
// 학생 정보 표시
// ========================================

document
  .getElementById("studentInfo")
  .innerHTML =
    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +
    "출결 : " +
    escapeHtml(action);


// ========================================
// 카메라 스트림
// ========================================

let stream = null;


// ========================================
// 카메라 시작
// ========================================

async function startCamera() {

  document
    .getElementById("message")
    .innerText =
      "카메라를 준비하는 중입니다...";

  document
    .getElementById("error")
    .innerText = "";

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "이 브라우저에서는 카메라 API를 사용할 수 없습니다."
      );

    }

    // ------------------------------------
    // test.html에서 성공했던 바로 그 방식
    // ------------------------------------

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    const video =
      document.getElementById("video");

    video.srcObject =
      stream;

    await video.play();

    document
      .getElementById("message")
      .innerText =
        "✅ 카메라가 정상적으로 열렸습니다.";

    document
      .getElementById("startButton")
      .disabled = true;

  } catch (error) {

    console.error(error);

    document
      .getElementById("message")
      .innerText =
        "❌ 카메라를 열지 못했습니다.";

    document
      .getElementById("error")
      .innerText =
        "오류 종류: " +
        error.name +
        "\n\n" +
        "오류 내용: " +
        error.message;
  }
}


// ========================================
// 페이지 종료 시 카메라 끄기
// ========================================

window.addEventListener(
  "pagehide",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );

      stream = null;
    }
  }
);


// ========================================
// HTML 안전처리
// ========================================

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
