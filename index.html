<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>수지쌤 QR 출석</title>

<!-- jsQR -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #111827;
  color: white;
  font-family:
    "Noto Sans KR",
    "Malgun Gothic",
    Arial,
    sans-serif;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 18px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

h1 {
  margin: 8px 0 5px;
  font-size: 27px;

.subtitle {
  color: #cbd5e1;
  font-size: 14px;
  margin-bottom: 18px;
}

.camera {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 22px;

}

#video {
  display: block;
  width: 100%;
  height: auto;
  min-height: 300px;
  object-fit: cover;
  background: #000;
}

#canvas {
  display: none;
}

.frame {
  position: absolute;
  left: 8%;

  pointer-events: none;
}

.line {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 3px;
  background: #ef4444;
  box-shadow: 0 0 12px #ef4444;
  animation: scan 1.7s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes scan {

  from {
    transform: translateY(-100px);
  }

  to {
    transform: translateY(100px);
  }

}

button {
  width: 100%;
  padding: 17px;

</head>


<body>

<div class="page">

<div class="card">

<h1>📷 수지쌤 저 왔어요</h1>

<div class="subtitle">
교실 QR을 초록색 네모 안에 맞춰주세요.
</div>


<div class="camera">

<video
  id="video"
  playsinline
  muted
  autoplay>
</video>

<canvas id="canvas"></canvas>

<div class="frame"></div>

<div class="line"></div>

</div>


<button
  id="start"
  onclick="startCamera()">
📷 카메라 시작
</button>


<button
  id="stop"
  onclick="stopCamera()">
카메라 닫기
</button>


<div id="status">
카메라 시작 버튼을 눌러주세요.
</div>

</div>

</div>


<script>

/* =====================================
   변수
===================================== */

let stream = null;

let scanning = false;

let lastScanTime = 0;


/* =====================================
   화면
===================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const statusBox =
  document.getElementById("status");

const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


/* =====================================
   상태 표시
===================================== */

function status(
  text,
  type
) {

  statusBox.textContent =
    text;

  statusBox.className =
    type || "";

}


/* =====================================
   카메라 시작
===================================== */

async function startCamera() {

  if (scanning) {
    return;
  }


  status(
    "카메라를 준비하는 중..."
  );


  try {

    /*
     * 휴대폰은 후면 카메라 우선
     */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    video.setAttribute(
      "playsinline",
      "true"
    );


    video.muted = true;


    await video.play();


    scanning = true;


    startButton.style.display =
      "none";

    stopButton.style.display =
      "block";


    status(
      "📷 카메라가 켜졌습니다.\n\n" +
      "QR을 화면 가까이 가져와 주세요."
    );


    requestAnimationFrame(
      scan
    );


  } catch (error) {

    console.error(
      error
    );


    status(
      "❌ 카메라를 시작하지 못했습니다.\n\n" +
      error.message,
      "error"
    );

  }

}


/* =====================================
   QR 스캔
===================================== */

function scan(
  timestamp
) {

  if (!scanning) {
    return;
  }


  /*
   * 너무 자주 분석하지 않음
   */

  if (
    timestamp -
    lastScanTime <
    120
  ) {

    requestAnimationFrame(
      scan
    );

    return;
  }


  lastScanTime =
    timestamp;


  if (
    video.readyState >=
    video.HAVE_ENOUGH_DATA
  ) {

    const width =
      video.videoWidth;

    const height =
      video.videoHeight;


    if (
      width > 0 &&
      height > 0
    ) {

      /*
       * 카메라 전체 영상을
       * 캔버스에 복사
       */

      canvas.width =
        width;

      canvas.height =
        height;


      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      try {

        const imageData =
          ctx.getImageData(
            0,
            0,
            width,
            height
          );


        /*
         * jsQR로 직접 해석
         */

        const code =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (code) {

          qrFound(
            code.data
          );

          return;

        }

      } catch (error) {

        console.error(
          "QR 분석 오류:",
          error
        );

      }

    }

  }


  requestAnimationFrame(
    scan
  );

}


/* =====================================
   QR 발견
===================================== */

function qrFound(
  value
) {

  scanning = false;


  console.log(
    "QR 발견:",
    value
  );


  /*
   * 여기서는 아직 출석 저장을 하지 않는다.
   * 실제 QR 값을 먼저 확인한다.
   */

  status(

    "✅ QR 인식 성공!\n\n" +
    "QR 내용:\n" +
    value,

    "success"

  );


  stopCamera();


}


/* =====================================
   카메라 종료
===================================== */

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }


  video.srcObject =
    null;


  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";

}


/* =====================================
   페이지 종료
===================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
