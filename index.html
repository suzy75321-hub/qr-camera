<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR 인증</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  background:#f5f7fb;
}

.box {
  max-width:420px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1 {
  font-size:24px;
}

.info {
  margin:15px 0;
  line-height:1.6;
}

button {
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  background:#333;
  color:white;
}

#reader {
  margin-top:20px;
}

#error {
  margin-top:15px;
  color:red;
  white-space:pre-line;
}

#result {
  margin-top:15px;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>📷 QR 인증</h1>

<div class="info">
교실 QR을 촬영해주세요.<br>
QR 촬영 시간이<br>
실제 등교/복귀 시간으로 기록됩니다.
</div>

<div id="studentInfo"></div>

<button onclick="startCamera()">
📷 카메라 시작
</button>

<div id="reader"></div>

<div id="result"></div>

<div id="error"></div>

</div>


<script>

const params =
new URLSearchParams(location.search);


const studentNumber =
params.get("studentNumber") || "";

const studentName =
params.get("studentName") || "";

const action =
params.get("action") || "";


document.getElementById("studentInfo").innerHTML =
`
<b>${studentNumber} ${studentName}</b><br>
출결 : ${action}
`;


let html5QrCode = null;



async function startCamera(){

  document.getElementById("error").innerText="";


  try{


    html5QrCode =
      new Html5Qrcode("reader");



    const cameras =
      await Html5Qrcode.getCameras();



    if(!cameras || cameras.length === 0){

      throw new Error(
        "카메라를 찾을 수 없습니다."
      );

    }



    /*
      아이폰:
      카메라 2개 이상이면 마지막 카메라 선택
      → 후면 카메라 가능성이 높음

      노트북:
      1개면 그대로 사용
    */


    let cameraId =
      cameras[0].id;


    if(cameras.length > 1){

      cameraId =
        cameras[cameras.length - 1].id;

    }



    await html5QrCode.start(

      cameraId,

      {
        fps:10,
        qrbox:{
          width:250,
          height:250
        }
      },


      onScanSuccess,


      function(errorMessage){

        console.log(errorMessage);

      }

    );


  } catch(error){


    document.getElementById("error").innerText =
    "❌ 카메라를 시작하지 못했습니다.\n\n"
    + error;


  }

}




async function onScanSuccess(decodedText){


  try{

    await html5QrCode.stop();

  }catch(e){}



  document.getElementById("result").innerHTML =
  `
  ✅ QR 인증 완료<br>
  ${decodedText}
  `;


}


</script>

</body>
</html>
