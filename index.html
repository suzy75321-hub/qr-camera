<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR 인증</title>

  <!-- QR 인식 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      font-family: Arial, "Noto Sans KR", sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
      padding: 28px 20px 30px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 5px 0 12px;
      font-size: 26px;
    }

    .subtitle {
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .notice {
      background: #fff8e5;
      padding: 15px;
      border-radius: 14px;
      margin: 15px 0;
      line-height: 1.6;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      margin: 20px auto;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #dff5e5;
    }

    .cancel {
      background: #eeeeee;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 18px;
      white-space: pre-line;
      line-height: 1.6;
      font-weight: bold;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>📷 QR 인증</h1>

  <div class="subtitle">
    교실 QR을 촬영해주세요.<br>
    QR을 촬영한 시간이 실제 등교/복귀 시간으로 기록됩니다.
  </div>


  <div class="notice">

    📷 아래 버튼을 누르면<br>
    카메라 권한을 요청합니다.

  </div>


  <div
    id="reader"
    class="hidden"
  ></div>


  <button
    id="startButton"
    class="button start"
    onclick="startCamera()"
  >
    📷 카메라 시작
  </button>


  <button
    id="cancelButton"
    class="button cancel"
    onclick="goBack()"
  >
    취소하고 돌아가기
  </button>


  <div id="message"></div>

</div>


<script>


// ========================================
// 전역 변수
// ========================================

let scanner = null;

let scanning = false;

let lastQr = "";


// ========================================
// 메시지
// ========================================

function showMessage(
  message,
  type
) {

  const element =
    document.getElementById("message");

  element.innerText =
    message;

  element.className =
    type || "";

}


// ========================================
// 카메라 시작
// ========================================

async function startCamera() {

  showMessage(
    "카메라를 준비하고 있습니다..."
  );


  // ----------------------------------------
  // 브라우저 카메라 권한 확인
  // ----------------------------------------

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showMessage(
      "❌ 이 브라우저에서는 카메라 기능을 사용할 수 없습니다.\n\n" +
      "HTTPS 페이지에서 다시 시도해주세요.",
      "error"
    );

    return;

  }


  try {

    /*
     * 카메라 권한 요청
     *
     * facingMode는 반드시 문자열로 사용
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "environment"
        },

        audio: false

      });


    /*
     * 권한 확인 완료.
     * 실제 QR 스캐너가 카메라를 다시 사용하므로
     * 여기서 임시 스트림은 종료한다.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


  } catch (error) {

    console.error(
      "카메라 권한 오류:",
      error
    );


    showMessage(

      "❌ 카메라 접근에 실패했습니다.\n\n" +

      "브라우저의 카메라 권한을 확인해주세요.\n\n" +

      "오류: " +
      error.name +
      "\n" +
      error.message,

      "error"

    );


    return;

  }


  // ----------------------------------------
  // 화면 변경
  // ----------------------------------------

  document
    .getElementById("startButton")
    .classList
    .add("hidden");


  document
    .getElementById("reader")
    .classList
    .remove("hidden");


  showMessage(
    "📷 교실 QR을 화면 안에 맞춰주세요."
  );


  // ----------------------------------------
  // QR 스캐너 시작
  // ----------------------------------------

  startQrScanner();

}


// ========================================
// QR 스캐너 시작
// ========================================

function startQrScanner() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showMessage(
      "❌ QR 스캐너 라이브러리를 불러오지 못했습니다.",
      "error"
    );

    return;

  }


  if (scanning) {

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const scannerConfig = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.QR_CODE

    ]

  };


  scanning = true;


  scanner
    .start(

      {
        facingMode: "environment"
      },

      scannerConfig,


      function(decodedText) {

        if (
          lastQr === decodedText
        ) {

          return;

        }


        lastQr =
          decodedText;


        handleQrSuccess(
          decodedText
        );

      },


      function() {

        // QR을 찾는 동안에는
        // 별도 메시지를 표시하지 않는다.

      }

    )


    .catch(
      function(error) {

        console.error(
          "QR 스캐너 오류:",
          error
        );


        scanning = false;


        showMessage(

          "❌ QR 카메라를 시작하지 못했습니다.\n\n" +

          String(error),

          "error"

        );


        document
          .getElementById("reader")
          .classList
          .add("hidden");


        document
          .getElementById("startButton")
          .classList
          .remove("hidden");

      }
    );

}


// ========================================
// QR 인식 성공
// ========================================

async function handleQrSuccess(
  decodedText
) {

  showMessage(
    "✅ QR을 읽었습니다."
  );


  await stopScanner();


  showMessage(

    "✅ 카메라와 QR 촬영이 정상 작동합니다.\n\n" +

    "QR 인증값:\n" +

    decodedText +

    "\n\n" +

    "🎉 카메라 테스트 성공!"

    ,

    "success"

  );

}


// ========================================
// QR 스캐너 종료
// ========================================

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      "scanner stop:",
      error
    );

  }


  try {

    scanner.clear();

  } catch (error) {

    console.log(
      "scanner clear:",
      error
    );

  }


  scanner = null;

  scanning = false;

}


// ========================================
// 뒤로가기
// ========================================

function goBack() {

  stopScanner()
    .finally(
      function() {

        if (
          window.history.length > 1
        ) {

          history.back();

        } else {

          window.location.href =
            "about:blank";

        }

      }
    );

}


// ========================================
// 페이지 종료
// ========================================

window.addEventListener(
  "beforeunload",
  function() {

    if (scanner) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>

</body>

</html>
