```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>수지쌤 QR 카메라 테스트</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 10px 0;
      font-size: 26px;
    }

    .info {
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: black;
      border-radius: 20px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
    }

    button {
      width: 100%;
      max-width: 520px;
      margin: 18px auto 0;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      width: 100%;
      max-width: 520px;
      margin: 20px auto 0;
      padding: 18px;
      border-radius: 15px;
      background: #1e293b;
      word-break: break-all;
      line-height: 1.6;
      min-height: 60px;
    }

    .ok {
      background: #166534 !important;
    }

    .error {
      background: #991b1b !important;
    }
  </style>
</head>

<body>

  <h1>📷 QR 카메라 테스트</h1>

  <div class="info">
    교실 QR을 화면 가운데에 크게 맞춰주세요.
  </div>

  <div id="reader"></div>

  <button onclick="startCamera()">
    📷 카메라 시작
  </button>

  <div id="result">
    QR을 기다리는 중...
  </div>


<script>

let scanner = null;
let running = false;
let detected = false;


/* ===============================
   결과 표시
================================ */

function result(text, type) {

  const box =
    document.getElementById("result");

  box.textContent = text;

  box.className = type || "";

}


/* ===============================
   QR 성공
================================ */

function onScanSuccess(decodedText) {

  if (detected) {
    return;
  }

  detected = true;

  console.log(
    "QR RAW VALUE:",
    decodedText
  );

  result(
    "✅ QR 인식 성공!\n\n" +
    "QR 안의 실제 값:\n" +
    decodedText,
    "ok"
  );

}


/* ===============================
   QR 탐색 중
================================ */

function onScanFailure(error) {

  /*
   * QR을 찾지 못할 때 발생하는
   * 정상적인 메시지이므로 화면에는 표시하지 않음.
   */

}


/* ===============================
   카메라 시작
================================ */

async function startCamera() {

  if (running) {
    return;
  }

  detected = false;

  result(
    "카메라를 시작하는 중..."
  );


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    result(
      "QR 라이브러리를 불러오지 못했습니다.",
      "error"
    );

    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 20,

        /*
         * QR 전체를 충분히 크게 잡는다.
         */

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.85;

          return {
            width: Math.floor(size),
            height: Math.floor(size)
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    running = true;

    result(
      "📷 카메라가 켜졌습니다.\n\n" +
      "QR을 카메라 가까이 가져와 주세요."
    );


  } catch (error) {

    console.error(
      error
    );


    /*
     * exact 환경 카메라 실패 시
     * 일반 environment로 다시 시도
     */

    try {

      await scanner.clear();

    } catch (e) {}


    scanner =
      new Html5Qrcode(
        "reader"
      );


    try {

      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 20,

          qrbox: {
            width: 300,
            height: 300
          },

          aspectRatio: 1.0,

          disableFlip: false

        },

        onScanSuccess,

        onScanFailure

      );


      running = true;

      result(
        "📷 카메라가 켜졌습니다.\n\n" +
        "QR을 카메라 가까이 가져와 주세요."
      );


    } catch (secondError) {

      console.error(
        secondError
      );

      running = false;
      scanner = null;

      result(
        "❌ 카메라를 시작하지 못했습니다.\n\n" +
        secondError.message,
        "error"
      );

    }

  }

}


/* ===============================
   페이지 종료
================================ */

window.addEventListener(
  "beforeunload",
  function() {

    if (scanner) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>

</body>
</html>
```
