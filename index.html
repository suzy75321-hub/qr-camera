<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR 인증</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
      padding: 28px 20px 30px;
      background: white;
      border-radius: 22px;
      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 5px 0 12px;
      font-size: 26px;
    }

    .subtitle {
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .student {
      background: #eef5ff;
      padding: 15px;
      border-radius: 14px;
      margin: 15px 0;
      line-height: 1.6;
      font-weight: bold;
    }

    .notice {
      background: #fff8e5;
      padding: 15px;
      border-radius: 14px;
      margin: 15px 0;
      line-height: 1.6;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      margin: 20px auto;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #dff5e5;
    }

    .cancel {
      background: #eeeeee;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 18px;
      white-space: pre-line;
      line-height: 1.6;
      font-weight: bold;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>📷 QR 인증</h1>

  <div class="subtitle">
    교실 QR을 촬영해주세요.<br>
    QR을 촬영한 시간이 실제 등교/복귀 시간으로 기록됩니다.
  </div>


  <!-- 학생 정보 -->

  <div
    id="studentBox"
    class="student hidden"
  >
    <span id="studentInfo"></span>
    <br>
    <span id="actionInfo"></span>
  </div>


  <!-- 안내 -->

  <div
    id="directNotice"
    class="notice hidden"
  >
    우리반 앱에서 전달된 출결 정보가 없습니다.<br><br>

    <b>카메라 테스트를 위해서는 아래 버튼을 눌러주세요.</b>
  </div>


  <!-- 카메라 -->

  <div
    id="reader"
    class="hidden"
  ></div>


  <!-- 시작 -->

  <button
    id="startButton"
    class="button start"
    onclick="startCamera()"
  >
    📷 카메라 시작
  </button>


  <!-- 취소 -->

  <button
    id="cancelButton"
    class="button cancel"
    onclick="goBack()"
  >
    취소하고 돌아가기
  </button>


  <div id="message"></div>

</div>


<script>

/* ========================================
   전역 변수
======================================== */

let scanner = null;

let scanning = false;

let lastQr = "";


/* ========================================
   URL 파라미터
======================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  params.get("studentNumber") || "";


const studentName =
  params.get("studentName") || "";


const action =
  params.get("action") || "";


/* ========================================
   시작할 때 화면 구성
======================================== */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    if (
      studentNumber &&
      studentName &&
      action
    ) {

      document
        .getElementById("studentBox")
        .classList
        .remove("hidden");

      document
        .getElementById("studentInfo")
        .innerText =
          studentNumber +
          " " +
          studentName;

      document
        .getElementById("actionInfo")
        .innerText =
          action;

    } else {

      document
        .getElementById("directNotice")
        .classList
        .remove("hidden");

    }

  }
);


/* ========================================
   메시지
======================================== */

function showMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "message"
    );

  element.innerText =
    message;

  element.className =
    type || "";

}


/* ========================================
   카메라 시작
======================================== */

async function startCamera() {

  showMessage(
    "카메라를 준비하고 있습니다..."
  );


  /*
   * 먼저 브라우저에
   * 카메라 권한을 직접 요청한다.
   */

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia(
        {
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        }
      );


    /*
     * 권한 확인용으로 잠깐 열었다가
     * QR 스캐너가 다시 카메라를 사용하도록
     * 스트림을 종료한다.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


  } catch (error) {

    console.error(
      "카메라 권한 오류:",
      error
    );


    showMessage(
      "❌ 카메라에 접근할 수 없습니다.\n\n" +
      "브라우저의 카메라 권한이 허용되어 있는지 확인해주세요.\n\n" +
      "오류: " +
      error.name,
      "error"
    );

    return;

  }


  /*
   * 실제 QR 스캐너 시작
   */

  document
    .getElementById("startButton")
    .classList
    .add("hidden");


  document
    .getElementById("reader")
    .classList
    .remove("hidden");


  showMessage(
    "📷 교실 QR을 화면 안에 맞춰주세요."
  );


  startQrScanner();

}


/* ========================================
   QR 스캐너
======================================== */

function startQrScanner() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showMessage(
      "❌ QR 스캐너 라이브러리를 불러오지 못했습니다.",
      "error"
    );

    return;

  }


  if (scanning) {
    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const scannerConfig = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0,

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]

  };


  scanning = true;


  scanner
    .start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      scannerConfig,

      function(decodedText) {

        if (
          lastQr === decodedText
        ) {

          return;

        }


        lastQr =
          decodedText;


        handleQrSuccess(
          decodedText
        );

      },

      function() {

        /*
         * QR을 찾는 동안에는
         * 별도 메시지를 표시하지 않는다.
         */

      }

    )

    .catch(
      function(error) {

        console.error(
          "QR 스캐너 오류:",
          error
        );

        scanning = false;

        showMessage(
          "❌ 카메라를 시작하지 못했습니다.\n\n" +
          String(error),
          "error"
        );

        document
          .getElementById("reader")
          .classList
          .add("hidden");

        document
          .getElementById("startButton")
          .classList
          .remove("hidden");

      }
    );

}


/* ========================================
   QR 촬영 성공
======================================== */

async function handleQrSuccess(
  decodedText
) {

  showMessage(
    "✅ QR을 읽었습니다.\n\n인증을 확인하는 중입니다..."
  );


  await stopScanner();


  /*
   * 현재는 카메라 기능 테스트 단계.
   *
   * 학생 정보가 URL로 전달되어 있다면
   * 다음 단계에서 Apps Script로 보낸다.
   */


  if (
    !studentNumber ||
    !studentName ||
    !action
  ) {

    showMessage(
      "✅ 카메라와 QR 촬영이 정상 작동합니다.\n\n" +
      "QR 값:\n" +
      decodedText +
      "\n\n" +
      "이제 우리반 앱과 연결하면 됩니다.",
      "success"
    );

    return;

  }


  /*
   * 실제 인증 연결은
   * Apps Script doPost 추가 후 연결한다.
   */

  showMessage(
    "✅ QR 촬영 완료!\n\n" +
    "학생: " +
    studentNumber +
    " " +
    studentName +
    "\n" +
    "상태: " +
    action +
    "\n\n" +
    "다음 단계에서 Apps Script 인증과 연결합니다.",
    "success"
  );

}


/* ========================================
   스캐너 종료
======================================== */

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      "scanner stop:",
      error
    );

  }


  try {

    scanner.clear();

  } catch (error) {

    console.log(
      "scanner clear:",
      error
    );

  }


  scanner = null;

  scanning = false;

}


/* ========================================
   뒤로가기
======================================== */

function goBack() {

  stopScanner()
    .finally(
      function() {

        if (
          window.history.length > 1
        ) {

          history.back();

        } else {

          window.location.href =
            "about:blank";

        }

      }
    );

}


/* ========================================
   페이지 종료
======================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (scanner) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>

</body>

</html>
