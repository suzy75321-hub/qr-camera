<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>수지쌤 QR 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 10px 0;
      font-size: 26px;
    }

    .guide {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .camera {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #000;
      object-fit: cover;
    }

    .frame {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 12%;
      bottom: 12%;
      border: 3px solid #22c55e;
      border-radius: 18px;
      pointer-events: none;
    }

    .line {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 3px;
      background: red;
      box-shadow: 0 0 12px red;
      animation: scan 1.5s infinite alternate;
      pointer-events: none;
    }

    @keyframes scan {
      from {
        transform: translateY(-110px);
      }

      to {
        transform: translateY(110px);
      }
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #stop {
      display: none;
      background: #475569;
    }

    #result {
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      background: #1e293b;
      min-height: 70px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }

    .success {
      background: #166534 !important;
    }

    .error {
      background: #991b1b !important;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>📷 QR 인식 테스트</h1>

  <div class="guide">
    아무 QR이나 화면에 띄워주세요.<br>
    QR을 초록색 영역 안에 크게 맞춰주세요.
  </div>

  <div class="camera">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="frame"></div>
    <div class="line"></div>

  </div>

  <button
    id="start"
    onclick="startCamera()">
    📷 카메라 시작
  </button>

  <button
    id="stop"
    onclick="stopCamera()">
    카메라 닫기
  </button>

  <div id="result">
    카메라 시작을 눌러주세요.
  </div>

</div>


<script>

/*
 * ZXing 브라우저 라이브러리
 *
 * 여러 CDN을 순서대로 시도한다.
 */

const ZXING_URL =
  "https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js";


let scriptLoaded = false;
let codeReader = null;
let controls = null;
let running = false;
let found = false;


/* =====================================
   화면
===================================== */

const video =
  document.getElementById("video");

const result =
  document.getElementById("result");

const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


function show(
  text,
  type
) {

  result.textContent =
    text;

  result.className =
    type || "";

}


/* =====================================
   ZXing 로드
===================================== */

function loadZXing() {

  return new Promise(
    function(resolve, reject) {

      if (
        window.ZXingBrowser
      ) {

        scriptLoaded = true;

        resolve();

        return;
      }


      const script =
        document.createElement(
          "script"
        );


      script.src =
        ZXING_URL;


      script.onload =
        function() {

          if (
            window.ZXingBrowser
          ) {

            scriptLoaded = true;

            resolve();

          } else {

            reject(
              new Error(
                "ZXingBrowser를 찾을 수 없습니다."
              )
            );

          }

        };


      script.onerror =
        function() {

          reject(
            new Error(
              "ZXing 라이브러리를 불러오지 못했습니다."
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* =====================================
   카메라 시작
===================================== */

async function startCamera() {

  if (running) {
    return;
  }


  found = false;


  show(
    "ZXing QR 인식기를 준비하는 중..."
  );


  try {

    await loadZXing();


    /*
     * ZXing QR 전용 리더
     */

    codeReader =
      new ZXingBrowser.BrowserQRCodeReader();


    /*
     * 사용 가능한 카메라 목록 확인
     */

    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "카메라를 찾을 수 없습니다."
      );

    }


    /*
     * 후면 카메라 선택
     */

    let deviceId =
      devices[0].deviceId;


    for (
      const device
      of devices
    ) {

      const label =
        String(
          device.label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("후면")
      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    show(
      "📷 카메라가 켜졌습니다.\n\nQR을 비춰주세요."
    );


    /*
     * 선택한 카메라로 QR 읽기 시작
     */

    controls =
      await codeReader.decodeFromVideoDevice(

        deviceId,

        video,

        function(
          resultObject,
          error
        ) {

          if (found) {
            return;
          }


          if (
            resultObject
          ) {

            found = true;


            const text =
              resultObject
                .getText();


            show(

              "✅ QR 인식 성공!\n\n" +
              "QR 내용:\n" +
              text,

              "success"

            );


            stopCamera();

          }

        }

      );


    running = true;


    startButton.style.display =
      "none";

    stopButton.style.display =
      "block";


  } catch (error) {

    console.error(
      "ZXing 오류:",
      error
    );


    running = false;


    show(

      "❌ QR 카메라를 시작하지 못했습니다.\n\n" +
      (
        error.message ||
        error
      ),

      "error"

    );

  }

}


/* =====================================
   카메라 종료
===================================== */

function stopCamera() {

  try {

    if (controls) {

      controls.stop();

    }

  } catch (e) {}


  try {

    if (
      codeReader &&
      codeReader.reset
    ) {

      codeReader.reset();

    }

  } catch (e) {}


  if (
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getTracks();


    tracks.forEach(
      function(track) {

        track.stop();

      }
    );

    video.srcObject =
      null;

  }


  controls =
    null;

  codeReader =
    null;

  running =
    false;


  startButton.style.display =
    "block";

  stopButton.style.display =
    "none";

}


/* =====================================
   종료
===================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
