<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR 카메라 테스트</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 440px;
      margin: 20px auto;
      padding: 25px 20px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .notice {
      background: #fff8e5;
      padding: 15px;
      border-radius: 14px;
      margin: 15px 0;
      line-height: 1.6;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      margin: 20px auto;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 18px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #dff5e5;
    }

    #cancelButton {
      background: #eeeeee;
    }

    #message {
      margin-top: 20px;
      white-space: pre-line;
      line-height: 1.6;
      font-weight: bold;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>📷 QR 카메라 테스트</h1>

  <div class="notice">
    아래 버튼을 누르면 카메라를 시작합니다.<br>
    QR을 비추면 정상 작동 여부를 확인합니다.
  </div>

  <div
    id="reader"
    class="hidden"
  ></div>

  <button
    id="startButton"
    onclick="startCamera()"
  >
    📷 카메라 시작
  </button>

  <button
    id="cancelButton"
    onclick="stopCamera()"
  >
    취소
  </button>

  <div id="message"></div>

</div>


<script>

let scanner = null;


/* ========================================
   카메라 시작
======================================== */

function startCamera() {

  document
    .getElementById("message")
    .innerText =
      "카메라를 준비하고 있습니다...";


  document
    .getElementById("startButton")
    .classList
    .add("hidden");


  document
    .getElementById("reader")
    .classList
    .remove("hidden");


  scanner =
    new Html5Qrcode("reader");


  /*
   * 중요
   *
   * 여기서는 facingMode를 사용하지 않는다.
   */

  const cameraConfig = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]

  };


  scanner
    .start(

      {
        facingMode: "environment"
      },

      cameraConfig,

      function(decodedText) {

        showSuccess(
          decodedText
        );

      },

      function(errorMessage) {

        // QR을 찾는 중에는 아무것도 표시하지 않음

      }

    )

    .catch(
      function(error) {

        console.error(error);


        document
          .getElementById("reader")
          .classList
          .add("hidden");


        document
          .getElementById("startButton")
          .classList
          .remove("hidden");


        showError(
          "❌ 카메라를 시작하지 못했습니다.\n\n" +
          String(error)
        );

      }
    );

}


/* ========================================
   QR 성공
======================================== */

function showSuccess(
  text
) {

  stopCamera();


  document
    .getElementById("message")
    .innerText =

      "🎉 카메라 테스트 성공!\n\n" +

      "읽은 QR 값:\n" +

      text;

  document
    .getElementById("message")
    .className =
      "success";

}


/* ========================================
   오류
======================================== */

function showError(
  text
) {

  document
    .getElementById("message")
    .innerText =
      text;

  document
    .getElementById("message")
    .className =
      "error";

}


/* ========================================
   카메라 종료
======================================== */

function stopCamera() {

  if (!scanner) {

    return;

  }


  scanner
    .stop()
    .then(
      function() {

        scanner.clear();

        scanner = null;

      }
    )
    .catch(
      function(error) {

        console.log(error);

        scanner = null;

      }
    );


  document
    .getElementById("reader")
    .classList
    .add("hidden");


  document
    .getElementById("startButton")
    .classList
    .remove("hidden");

}

</script>

</body>

</html>
