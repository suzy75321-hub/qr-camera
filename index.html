<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>교실 QR 인증</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin: 5px 0 10px;
  font-size: 25px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

.camera-button {
  display: block;
  width: 100%;
  padding: 17px;
  margin: 8px 0;
  border-radius: 14px;
  background: #333;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#qrInput {
  display: none;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

#result {
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

#error {
  margin-top: 18px;
  color: #c62828;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

.small {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 14px;
}

</style>

</head>


<body>

<div class="box">

<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
확인 중...
</div>


<label
  for="qrInput"
  class="camera-button"
>
📷 교실 QR 찍기
</label>


<input
  id="qrInput"
  type="file"
  accept="image/*"
  capture="environment"
>


<div id="reader"></div>


<div id="result"></div>

<div id="error"></div>


<div class="small">

교실에 있는 고정 QR을 찍어주세요.<br>
촬영한 사진은 이 페이지에서만 QR 판독에 사용됩니다.

</div>

</div>


<script>

// ============================================================
// URL 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 화면 표시
// ============================================================

document
  .getElementById("studentInfo")
  .innerHTML =
    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +
    "출결 : " +
    escapeHtml(action) +
    "<br><br>" +
    "교실 QR을 찍어주세요.";


// ============================================================
// QR 스캐너 객체
// ============================================================

const scanner =
  new Html5Qrcode(
    "reader"
  );


// ============================================================
// 사진 선택/촬영
// ============================================================

document
  .getElementById("qrInput")
  .addEventListener(
    "change",
    async function(event) {

      const file =
        event.target.files &&
        event.target.files[0];


      if (!file) {
        return;
      }


      clearMessages();


      showResult(
        "📷 촬영한 사진에서 QR을 찾는 중입니다..."
      );


      try {

        // ------------------------------------------------------
        // html5-qrcode 공식 파일 스캔
        // ------------------------------------------------------

        const decodedText =
          await scanner.scanFile(
            file,
            false
          );


        if (!decodedText) {

          throw new Error(
            "QR 내용을 읽지 못했습니다."
          );

        }


        showResult(
          "✅ QR을 읽었습니다.\n" +
          "학생 정보를 확인하고 있습니다..."
        );


        verifyQr(
          decodedText
        );


      } catch(error) {

        console.error(
          error
        );


        showError(
          "❌ QR을 읽지 못했습니다.\n\n" +
          "QR이 사진에 선명하게 나오도록\n" +
          "조금 가까이에서 다시 찍어주세요."
        );

      }


      // 같은 사진도 다시 선택 가능하도록 초기화
      event.target.value = "";

    }
  );


// ============================================================
// QR 인증 서버 요청
// ============================================================

function verifyQr(
  decodedText
) {

  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  window.location.href =
    verifyUrl;
}


// ============================================================
// 메시지
// ============================================================

function showResult(
  text
) {

  document
    .getElementById(
      "result"
    )
    .innerText =
      text;


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


function showError(
  text
) {

  document
    .getElementById(
      "error"
    )
    .innerText =
      text;


  document
    .getElementById(
      "result"
    )
    .innerText =
      "";

}


function clearMessages() {

  document
    .getElementById(
      "result"
    )
    .innerText =
      "";


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
