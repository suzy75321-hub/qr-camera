<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>교실 QR 인증</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px 20px 30px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin: 5px 0 10px;
  font-size: 25px;
}

.info {
  background: #eef7ff;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

#reader {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: none;
  border-radius: 13px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.dark {
  background: #333;
  color: white;
}

.gray {
  background: #eeeeee;
}

#result {
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
}

#error {
  margin-top: 18px;
  color: #c62828;
  font-weight: bold;
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}

.small {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

.camera-list {
  margin-top: 15px;
  text-align: left;
}

.camera-list select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
}

</style>

</head>


<body>

<div class="box">

<h1>
📷 교실 QR 인증
</h1>


<div
  id="studentInfo"
  class="info"
>
확인 중...
</div>


<button
  id="startButton"
  class="button dark"
  type="button"
  onclick="startCamera()"
>
📷 카메라 시작
</button>


<button
  id="stopButton"
  class="button gray hidden"
  type="button"
  onclick="stopCamera()"
>
카메라 끄기
</button>


<div
  id="reader"
></div>


<div
  id="cameraChoice"
  class="camera-list hidden"
>

<select
  id="cameraSelect"
>
</select>

</div>


<div
  id="result"
></div>


<div
  id="error"
></div>


<div class="small">

교실에 있는 QR을 한 번만 찍어주세요.<br>

<b>
QR을 인증한 시간이 실제 등교/복귀 시간으로 기록됩니다.
</b>

</div>


</div>


<script>


// ============================================================
// URL 정보
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const studentNumber =
  String(
    params.get("studentNumber") || ""
  ).trim();


const studentName =
  String(
    params.get("studentName") || ""
  ).trim();


const action =
  String(
    params.get("action") || ""
  ).trim();


const returnUrl =
  String(
    params.get("returnUrl") || ""
  ).trim();


// ============================================================
// Apps Script 주소
// ============================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwjXwujbqVUqpDpxdjlqdOTzPLu-6sLA0bMKnVKuc_cWpkC_R99fLfI49ZfvjHTUwxI/exec";


// ============================================================
// 상태
// ============================================================

let scanner = null;

let cameras = [];

let scanning = false;

let completed = false;


// ============================================================
// 학생 정보
// ============================================================

document
  .getElementById("studentInfo")
  .innerHTML =

    "<b>" +
    escapeHtml(studentNumber) +
    " " +
    escapeHtml(studentName) +
    "</b><br><br>" +

    "출결 : " +
    escapeHtml(action) +

    "<br><br>" +

    "교실 QR을 찍어주세요.";


// ============================================================
// 필수 정보 확인
// ============================================================

if (
  !studentNumber ||
  !studentName ||
  !action ||
  !returnUrl
) {

  showError(
    "인증 정보가 없습니다.\n" +
    "조종례 앱에서 다시 시도해주세요."
  );

  document
    .getElementById("startButton")
    .disabled = true;

}


// ============================================================
// 카메라 목록 가져오기
// ============================================================

async function getCameraList() {

  cameras =
    await Html5Qrcode.getCameras();


  if (
    !cameras ||
    cameras.length === 0
  ) {

    throw new Error(
      "사용 가능한 카메라가 없습니다."
    );
  }


  const select =
    document
      .getElementById(
        "cameraSelect"
      );


  select.innerHTML =
    "";


  cameras.forEach(
    function(camera, index) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        camera.id;


      option.textContent =
        camera.label ||
        "카메라 " +
        (index + 1);


      select.appendChild(
        option
      );

    }
  );


  // ----------------------------------------------------------
  // 모바일에서는 후면 카메라를 우선 선택
  // 노트북에서는 첫 번째 카메라 사용
  // ----------------------------------------------------------

  const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    );


  if (isMobile) {

    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("후면")
          );

        }
      );


    if (backCamera) {

      select.value =
        backCamera.id;

    } else {

      select.value =
        cameras[
          cameras.length - 1
        ].id;

    }

  } else {

    select.value =
      cameras[0].id;

  }


  document
    .getElementById(
      "cameraChoice"
    )
    .classList
    .remove("hidden");

}


// ============================================================
// 카메라 시작
// ============================================================

async function startCamera() {

  if (scanning) {
    return;
  }


  clearMessages();


  try {

    // --------------------------------------------------------
    // 카메라 목록 확보
    // --------------------------------------------------------

    await getCameraList();


    // --------------------------------------------------------
    // 첫 번째 카메라로 시작
    // --------------------------------------------------------

    const cameraId =
      document
        .getElementById(
          "cameraSelect"
        )
        .value;


    if (!cameraId) {

      throw new Error(
        "카메라를 선택할 수 없습니다."
      );
    }


    await startWithCamera(
      cameraId
    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      "❌ 카메라 시작 실패\n\n" +
      error.name +
      "\n" +
      error.message
    );

  }

}


// ============================================================
// 선택된 카메라로 시작
// ============================================================

async function startWithCamera(
  cameraId
) {

  if (scanner) {

    try {
      await scanner.clear();
    } catch(e) {}

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const scanConfig = {

    fps: 10,

    qrbox: {
      width: 260,
      height: 260
    },

    aspectRatio: 1.0,

    disableFlip: false

  };


  await scanner.start(

    cameraId,

    scanConfig,

    function(decodedText) {

      handleScan(
        decodedText
      );

    },

    function() {

      // 검색 중에는 아무것도 표시하지 않음

    }

  );


  scanning =
    true;


  document
    .getElementById(
      "startButton"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "stopButton"
    )
    .classList
    .remove("hidden");

}


// ============================================================
// 카메라 변경
// ============================================================

document
  .getElementById(
    "cameraSelect"
  )
  .addEventListener(
    "change",
    async function() {

      if (!scanning) {
        return;
      }


      try {

        await stopCamera();


        await startWithCamera(
          this.value
        );


      } catch (error) {

        showError(
          "카메라 변경 실패\n\n" +
          error.name +
          "\n" +
          error.message
        );

      }

    }
  );


// ============================================================
// QR 스캔 성공
// ============================================================

async function handleScan(
  decodedText
) {

  if (
    completed ||
    !scanning
  ) {

    return;
  }


  completed =
    true;


  scanning =
    false;


  showResult(
    "✅ QR을 확인했습니다.\n" +
    "출결을 처리하고 있습니다..."
  );


  await stopCamera();


  // ----------------------------------------------------------
  // Apps Script 인증
  // ----------------------------------------------------------

  const verifyUrl =
    WEB_APP_URL +

    "?mode=qr" +

    "&studentNumber=" +
    encodeURIComponent(
      studentNumber
    ) +

    "&studentName=" +
    encodeURIComponent(
      studentName
    ) +

    "&action=" +
    encodeURIComponent(
      action
    ) +

    "&token=" +
    encodeURIComponent(
      decodedText
    ) +

    "&returnUrl=" +
    encodeURIComponent(
      returnUrl
    );


  window.location.href =
    verifyUrl;

}


// ============================================================
// 카메라 종료
// ============================================================

async function stopCamera() {

  if (!scanner) {

    scanning =
      false;

    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.warn(
      "camera stop",
      error
    );

  }


  try {

    await scanner.clear();

  } catch (error) {

    console.warn(
      "scanner clear",
      error
    );

  }


  scanner =
    null;

  scanning =
    false;


  document
    .getElementById(
      "stopButton"
    )
    .classList
    .add("hidden");


  if (!completed) {

    document
      .getElementById(
        "startButton"
      )
      .classList
      .remove("hidden");

  }

}


// ============================================================
// 메시지
// ============================================================

function showResult(
  text
) {

  document
    .getElementById(
      "result"
    )
    .innerText =
      text;


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


function showError(
  text
) {

  document
    .getElementById(
      "error"
    )
    .innerText =
      text;


  document
    .getElementById(
      "result"
    )
    .innerText =
      "";

}


function clearMessages() {

  document
    .getElementById(
      "result"
    )
    .innerText =
      "";


  document
    .getElementById(
      "error"
    )
    .innerText =
      "";

}


// ============================================================
// HTML 안전처리
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
